defaults: [../datasets/deepglobe.yaml, ../models/oriweaveformer.yaml]
experiment_id: oriweaveformer_final
output_dir: runs/oriweaveformer_final/deepglobe_base
crop_size: 512
epochs: 150
# Training schedule: 150 epochs, effective batch size 8.
batch_size: 8
accumulation_steps: 1
optimizer: adamw
learning_rate: 2.0e-4
weight_decay: 1.0e-4
warmup_epochs: 3
loss: bce_dice
ema_decay: 0.999
amp: float16
num_workers: 6
val_workers: 2
val_interval: 10
seed: 42
resume: false
