defaults: [../datasets/massachusetts.yaml, ../models/oriweaveformer.yaml]
experiment_id: oriweaveformer_final
output_dir: runs/oriweaveformer_final/massachusetts
crop_size: 512
epochs: 250
schedule_epochs: 250
# Historical Kaggle run: 2 processes x 4 images = global batch 8.
batch_size: 4
accumulation_steps: 1
optimizer: adamw
learning_rate: 2.0e-4
weight_decay: 1.0e-4
warmup_epochs: 3
loss: bce_dice
ema_decay: 0.999
amp: float16
num_workers: 1
val_workers: 1
persistent_workers: false
val_interval: 10
seed: 42
resume: false
