<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1090" viewBox="0 0 1520 1090">
<title>OriWeaveFormer architecture, verified against model.py</title>
<desc>MiT-B3 encoder with four feature scales; one shared orientation head conditions three residual OCFE blocks and the multiscale decoder. Sigmoid and thresholding are outside model.forward.</desc>
<defs>
 <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#53677e"/></marker>
 <marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#c5791b"/></marker>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#16324f} .title{font-size:30px;font-weight:700} .h{font-size:21px;font-weight:700} .body{font-size:18px} .small{font-size:16px;fill:#4c6278} .wire{fill:none;stroke:#53677e;stroke-width:2.5;marker-end:url(#arrow)} .field{fill:none;stroke:#c5791b;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#orange)} .blue{fill:#eaf2fc;stroke:#7ba4d5;stroke-width:1.5} .teal{fill:#e8f6f2;stroke:#69b3a0;stroke-width:1.5} .gold{fill:#fff3dc;stroke:#d6a24c;stroke-width:1.5} .purple{fill:#f0ecfb;stroke:#aa94d0;stroke-width:1.5} .white{fill:#fff;stroke:#b0becd;stroke-width:1.5}
 </style>
</defs>
<rect width="1520" height="1090" fill="#fff"/>
<text x="45" y="48" class="title">OriWeaveFormer · architecture overview</text>
<text x="45" y="80" class="body">Example: RGB input 512 × 512 · MiT-B3 · 46,543,147 parameters · default decoder width 256</text>

<!-- Orientation is produced once, before any OCFE block. -->
<rect x="860" y="108" width="335" height="86" rx="14" class="gold"/>
<text x="1027" y="141" text-anchor="middle" class="h">One shared OrientHead</text>
<text x="1027" y="172" text-anchor="middle" class="body">p, q, confidence · 128 × 128</text>
<path d="M780 270 H810 V150 H860" class="wire"/>
<path d="M1027 194 V210 H838 V600" fill="none" stroke="#c5791b" stroke-width="2.5" stroke-dasharray="8 6"/>
<path d="M838 270 H860" class="field"/>
<path d="M838 380 H860" class="field"/>
<path d="M838 600 H860" class="field"/>
<path d="M1195 150 H1470 V718 H1030 V770" class="field"/>
<text x="1210" y="130" class="small">also conditions decoder</text>

<!-- Encoder pyramid. -->
<rect x="40" y="380" width="180" height="105" rx="14" class="white"/>
<text x="130" y="414" text-anchor="middle" class="h">1. RGB image</text>
<text x="130" y="446" text-anchor="middle" class="body">3 × 512 × 512</text>
<text x="130" y="469" text-anchor="middle" class="small">normalized input</text>
<path d="M220 432 H267" class="wire"/>
<rect x="270" y="370" width="245" height="125" rx="14" class="blue"/>
<text x="392" y="405" text-anchor="middle" class="h">2. MiT-B3 encoder</text>
<text x="392" y="437" text-anchor="middle" class="body">hierarchical Transformer</text>
<text x="392" y="469" text-anchor="middle" class="small">four feature stages</text>
<path d="M515 432 H550 V270 H585" class="wire"/>
<path d="M550 432 V380 H585" class="wire"/>
<path d="M550 432 V490 H585" class="wire"/>
<path d="M550 490 V600 H585" class="wire"/>
<text x="595" y="223" class="small">channels × height × width</text>

<rect x="590" y="235" width="190" height="70" rx="12" class="blue"/>
<text x="685" y="262" text-anchor="middle" class="h">F1 · 1/4</text>
<text x="685" y="290" text-anchor="middle" class="body">64 × 128 × 128</text>
<rect x="590" y="345" width="190" height="70" rx="12" class="blue"/>
<text x="685" y="372" text-anchor="middle" class="h">F2 · 1/8</text>
<text x="685" y="400" text-anchor="middle" class="body">128 × 64 × 64</text>
<rect x="590" y="455" width="190" height="70" rx="12" class="blue"/>
<text x="685" y="482" text-anchor="middle" class="h">F3 · 1/16</text>
<text x="685" y="510" text-anchor="middle" class="body">320 × 32 × 32</text>
<rect x="590" y="565" width="190" height="70" rx="12" class="blue"/>
<text x="685" y="592" text-anchor="middle" class="h">F4 · 1/32</text>
<text x="685" y="620" text-anchor="middle" class="body">512 × 16 × 16</text>

<path d="M780 270 H860" class="wire"/>
<path d="M780 380 H860" class="wire"/>
<path d="M780 490 H860" class="wire"/>
<path d="M780 600 H860" class="wire"/>
<rect x="860" y="235" width="250" height="70" rx="12" class="teal"/>
<text x="985" y="263" text-anchor="middle" class="h">3. Residual OCFE</text>
<text x="985" y="290" text-anchor="middle" class="body">span 4 · 8 sample locations</text>
<rect x="860" y="345" width="250" height="70" rx="12" class="teal"/>
<text x="985" y="373" text-anchor="middle" class="h">3. Residual OCFE</text>
<text x="985" y="400" text-anchor="middle" class="body">span 3 · 6 sample locations</text>
<rect x="860" y="455" width="250" height="70" rx="12" class="white"/>
<text x="985" y="483" text-anchor="middle" class="h">Direct feature path</text>
<text x="985" y="510" text-anchor="middle" class="body">no OCFE at this scale</text>
<rect x="860" y="565" width="250" height="70" rx="12" class="teal"/>
<text x="985" y="593" text-anchor="middle" class="h">3. Residual OCFE</text>
<text x="985" y="620" text-anchor="middle" class="body">span 8 · 16 sample locations</text>

<path d="M1110 270 H1170" class="wire"/>
<path d="M1110 380 H1170" class="wire"/>
<path d="M1110 490 H1170" class="wire"/>
<path d="M1110 600 H1170" class="wire"/>
<rect x="1170" y="225" width="255" height="420" rx="16" class="purple"/>
<text x="1297" y="265" text-anchor="middle" class="h">4. Per-scale projection</text>
<text x="1297" y="308" text-anchor="middle" class="body">Conv 1×1</text>
<text x="1297" y="337" text-anchor="middle" class="body">GroupNorm + GELU</text>
<path d="M1297 359 V389" class="wire"/>
<text x="1297" y="424" text-anchor="middle" class="body">Bilinear resize</text>
<text x="1297" y="453" text-anchor="middle" class="body">to 128 × 128</text>
<rect x="1192" y="487" width="210" height="128" rx="10" fill="#fff"/>
<text x="1297" y="522" text-anchor="middle" class="h">P1, P2, P3, P4</text>
<text x="1297" y="554" text-anchor="middle" class="body">each 256 channels</text>
<text x="1297" y="582" text-anchor="middle" class="body">each 128 × 128</text>
<path d="M1297 645 V684 H735 V770" class="wire"/>

<rect x="45" y="557" width="450" height="134" rx="12" fill="#f6f8fb"/>
<text x="65" y="589" class="body">Solid arrows: feature tensors</text>
<text x="65" y="621" class="body" fill="#c5791b">Dashed arrows: shared field (p, q, c)</text>
<text x="65" y="654" class="small">Field resized + p/q renormalized per OCFE scale.</text>

<rect x="540" y="770" width="560" height="110" rx="16" class="purple"/>
<text x="820" y="805" text-anchor="middle" class="h">5. Orientation-conditioned multiscale fusion</text>
<text x="820" y="837" text-anchor="middle" class="body">concatenation branch + adaptive weighted-sum branch</text>
<text x="820" y="863" text-anchor="middle" class="small">see oriweaveformer_decoder.svg for the internal connections</text>
<path d="M540 825 H485" class="wire"/>
<rect x="50" y="770" width="435" height="110" rx="16" class="teal"/>
<text x="267" y="805" text-anchor="middle" class="h">6. Prediction head</text>
<text x="267" y="837" text-anchor="middle" class="body">Conv 3×3 + GN + GELU + Dropout(0.1)</text>
<text x="267" y="863" text-anchor="middle" class="body">Conv 1×1 → 1-channel low-res logits</text>
<path d="M267 880 V917" class="wire"/>
<rect x="50" y="920" width="435" height="98" rx="14" class="blue"/>
<text x="267" y="955" text-anchor="middle" class="h">7. Bilinear resize to input size</text>
<text x="267" y="988" text-anchor="middle" class="body">model output: logits · 1 × 512 × 512</text>
<path d="M485 967 H540" class="wire"/>
<rect x="540" y="920" width="560" height="98" rx="14" class="white"/>
<text x="820" y="955" text-anchor="middle" class="h">8. Sigmoid → probability → threshold → mask</text>
<text x="820" y="988" text-anchor="middle" class="body">postprocessing outside model.forward()</text>
<text x="45" y="1060" class="small">Training objective: BCE + Dice only. Orientation is a latent field; there is no orientation target or auxiliary orientation loss.</text>
</svg>
