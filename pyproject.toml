[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oriweaveformer"
version = "0.1.0"
description = "Standalone OriWeaveFormer road segmentation research implementation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.8.0", "torchvision==0.23.0",
  "segmentation-models-pytorch==0.5.0", "timm==1.0.19",
  "albumentations==2.0.8", "opencv-python-headless==4.12.0.88",
  "numpy==2.2.6", "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
oriweaveformer-train = "oriweaveformer.train:main"
oriweaveformer-evaluate = "oriweaveformer.evaluate:main"
oriweaveformer-prepare-data = "oriweaveformer.prepare_data:main"
oriweaveformer-export-results = "oriweaveformer.export_results:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_temp"
